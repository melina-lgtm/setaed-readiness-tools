<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 290 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PRISM — Portfolio Readiness Insight and Scoring Methodology">
  <title>PRISM</title>
  <desc>SETA-ED's PRISM logo: an orange triangular prism splitting a single ray of light into three colored bands representing the three readiness dimensions (Prototype, People, Process), paired with the PRISM wordmark.</desc>
  <!-- Icon: prism splitting incoming light into three readiness bands -->
  <g transform="translate(0,0)">
    <!-- Incoming ray (single proposal entering) -->
    <line x1="3" y1="30" x2="29" y2="30" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Prism (orange brand mark) -->
    <polygon points="40,8 22,48 56,48" fill="#E8861C"/>
    <!-- Three exiting rays in the three readiness colors -->
    <line x1="48" y1="29" x2="100" y2="9" stroke="#1F3A5F" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="49" y1="30" x2="100" y2="30" stroke="#5B7FB8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="48" y1="31" x2="100" y2="51" stroke="#82A4D0" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- Wordmark: PRISM with S in orange accent -->
  <text x="116" y="45" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="-1.5">
    <tspan fill="#1F3A5F">PRI</tspan><tspan fill="#E8861C">S</tspan><tspan fill="#1F3A5F">M</tspan>
  </text>
</svg>
